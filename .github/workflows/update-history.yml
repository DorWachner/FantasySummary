name: Update league history

on:
  schedule:
    # 06:30 UTC is 08:30 in Israel in winter (09:30 in summer), after the night's NBA games end.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/updateHistory.mjs
      - name: Commit the new history
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "chore: update league history"
          git push
