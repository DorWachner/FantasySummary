name: Update league history

on:
  schedule:
    # ESPN usually finishes a night at about 03:00 in New York (08:00 UTC, 10:00 in Israel).
    # Check every 30 minutes from 03:00 to 14:30 UTC so a late ESPN or a delayed GitHub run is
    # still caught; each run stops without committing unless a new night is waiting.
    - cron: "*/30 3-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: check
        run: node scripts/checkSalesStale.mjs
      # Manual runs always refresh; scheduled runs only when a new night is waiting.
      - if: github.event_name == 'workflow_dispatch' || steps.check.outputs.stale == 'true'
        run: node scripts/updateHistory.mjs
      - if: github.event_name == 'workflow_dispatch' || steps.check.outputs.stale == 'true'
        run: node scripts/updateSales.mjs
      - name: Commit the new history
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.stale == 'true'
        run: |
          git add data/history.json data/sales-history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update league history"
          git push
